[workspace]
resolver = "2"
members = [
  "crates/core", "crates/protocol", "crates/registry", "crates/matcher",
  "crates/session", "crates/router", "crates/link", "crates/transport-quic",
  "crates/ipc", "crates/discovery", "crates/discovery-mdns",
  "crates/discovery-ble", "crates/discovery-wifi-aware", "crates/net-report",
  "crates/magic-socket", "crates/relay", "crates/identity", "crates/policy", "crates/crypto",
  "crates/clock", "crates/storage", "crates/sdk", "crates/hub",
  "crates/app-broker", "crates/client", "apps/desktop-hub", "apps/desktop-echo", "crates/android-jni",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"

[workspace.dependencies]
async-trait = "0.1"
bytes = "1"
fabric-core = { path = "crates/core", version = "0.1.0" }
fabric-protocol = { path = "crates/protocol", version = "0.1.0" }
fabric-identity = { path = "crates/identity", version = "0.1.0" }
fabric-registry = { path = "crates/registry", version = "0.1.0" }
fabric-router = { path = "crates/router", version = "0.1.0" }
fabric-session = { path = "crates/session", version = "0.1.0" }
fabric-link = { path = "crates/link", version = "0.1.0" }
fabric-discovery = { path = "crates/discovery", version = "0.1.0" }
fabric-storage = { path = "crates/storage", version = "0.1.0" }
fabric-policy = { path = "crates/policy", version = "0.1.0" }
fabric-clock = { path = "crates/clock", version = "0.1.0" }
fabric-crypto = { path = "crates/crypto", version = "0.1.0" }
fabric-ipc = { path = "crates/ipc", version = "0.1.0" }
fabric-transport-quic = { path = "crates/transport-quic", version = "0.1.0" }
fabric-discovery-mdns = { path = "crates/discovery-mdns", version = "0.1.0" }
fabric-discovery-ble = { path = "crates/discovery-ble", version = "0.1.0" }
fabric-discovery-wifi-aware = { path = "crates/discovery-wifi-aware", version = "0.1.0" }
fabric-net-report = { path = "crates/net-report", version = "0.1.0" }
fabric-magic-socket = { path = "crates/magic-socket", version = "0.1.0" }
fabric-relay = { path = "crates/relay", version = "0.1.0" }
noq-udp = { version = "1.1", default-features = false }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
prost = "0.14"
prost-build = "0.14"
protoc-bin-vendored = "3"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
futures-core = "0.3"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
noq = { version = "1.1", default-features = false, features = ["runtime-tokio", "rustls", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
x509-parser = { version = "0.18", features = ["verify"] }
mdns-sd = "0.20"
chacha20poly1305 = "0.10"
hkdf = "0.12"
zeroize = "1"
toml = "0.9"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
