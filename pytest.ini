[pytest]
testpaths = tests
addopts = -ra --strict-markers
markers =
    core: cache, connection and recording boundaries
    agent: capture routing, model tools and durable state
    fabric: authenticated application messages and coordinator fencing
    onboarding: pairing, discovery, enrollment and OOBE
    rhythm: focus reminders and research sessions
    assistant: assistant domain, A2UI model and official schemas
    sdk: SDK Bluetooth and LittleFS regressions (requires an SDK checkout)
    integration: local HTTPS fixture with real SDK mbedTLS; no cloud calls
